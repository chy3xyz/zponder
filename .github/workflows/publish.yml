name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # 与 src/ 使用的 Zig 版本保持一致；官方稳定版 0.17.0 已发布，
  # 从 ziglang.org/download/<version> 下载（命名 zig-<triplet>-<version>）。
  ZIG_VERSION: "0.17.0"

# 默认最小权限；只有 publish job 需要写权限（建 GitHub Release）
permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-arm64
          # macos-13 已退役；Intel macOS 用 macos-15-intel
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-latest
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig 曾因 mirror 404/503 导致 "Unable to locate executable file: zig"
      # （v0.6.0 / v0.4.0 发布失败根因），改为从 ziglang.org 官方源直接下载。
      # 注意：$GITHUB_PATH 只对后续步骤生效，当前步骤内须用绝对路径验证。
      - name: Setup Zig
        run: |
          case "${{ matrix.platform }}" in
            darwin-arm64) TRIPLET="zig-aarch64-macos" ;;
            darwin-x64)   TRIPLET="zig-x86_64-macos" ;;
            linux-x64)    TRIPLET="zig-x86_64-linux" ;;
          esac
          URL="https://ziglang.org/download/${ZIG_VERSION}/${TRIPLET}-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$URL" -o zig.tar.xz
          tar -xJf zig.tar.xz
          ZIG_DIR="$GITHUB_WORKSPACE/${TRIPLET}-${ZIG_VERSION}"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        # 发布二进制用 -Drocksdb=false -Dpostgres=false 构建，只需要 sqlite3 的开发头文件
        run: brew install sqlite3

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev

      # 冷缓存时要现拉 build.zig.zon 里的 zgraphql git 依赖，GitHub 偶发
      # `HttpConnectionClosing`（v0.8.6 首跑就死在这，整个发布失败、npm 也没发出去）。
      # 依赖拉取发生在任何编译之前，重试成本很低，所以这里直接重试整步。
      - name: Build
        run: |
          for i in 1 2 3; do
            if zig build -Doptimize=ReleaseFast -Drocksdb=false -Dpostgres=false; then exit 0; fi
            echo "::warning::第 $i 次构建失败（多为依赖拉取网络抖动），10 秒后重试"
            sleep 10
          done
          echo "::error::连续 3 次构建失败"; exit 1

      - name: Test
        run: zig build test -Drocksdb=false -Dpostgres=false

      # 门禁：发布出去的二进制必须在干净机器上能跑 —— 不许动态依赖 librocksdb/libpq。
      # 只"能运行"不算证据（runner 上恰好装了这些库），必须查动态依赖表。
      - name: Assert binary has no optional-backend deps
        run: |
          set -e
          BIN=zig-out/bin/zponder
          ./"$BIN" version
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$BIN"
            ! otool -L "$BIN" | grep -E "rocksdb|libpq"
          else
            ldd "$BIN"
            ! ldd "$BIN" | grep -E "rocksdb|libpq"
          fi

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp zig-out/bin/zponder artifacts/zponder
          chmod +x artifacts/zponder

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: artifacts/zponder

  publish:
    name: publish npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin-arm64
        uses: actions/download-artifact@v4
        with: { name: binary-darwin-arm64, path: npm/zponder/bin/darwin-arm64 }
        continue-on-error: true

      - name: Download darwin-x64
        uses: actions/download-artifact@v4
        with: { name: binary-darwin-x64, path: npm/zponder/bin/darwin-x64 }
        continue-on-error: true

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with: { name: binary-linux-x64, path: npm/zponder/bin/linux-x64 }
        continue-on-error: true

      - name: Set permissions
        run: chmod +x npm/zponder/bin/*/zponder 2>/dev/null || true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd npm/zponder
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Version: $VERSION"

      - name: Publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: npm/zponder
          access: public

      # npm 之外再挂一份可下载的二进制：此前仓库最新 Release 还停在 v0.4.0 且
      # assets=0，任何 releases/download/… 链接都是 404。用 tag 的注解当 release notes
      # （tag 是 annotated 的）；重跑时改为覆盖上传，保持幂等。
      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          for p in darwin-arm64 darwin-x64 linux-x64; do
            cp "npm/zponder/bin/$p/zponder" "dist/zponder-$p"
          done
          chmod +x dist/*
          ls -lh dist
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            gh release create "v${VERSION}" \
              --title "zponder v${VERSION}" \
              --notes-from-tag \
              dist/*
          fi
