name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # 与 src/ 使用的 Zig 版本保持一致；官方稳定版尚无 0.17.0，
  # 从 ziglang.org/builds 下载 master/dev 构建（命名 zig-<triplet>-<version>）。
  ZIG_VERSION: "0.17.0-dev.1567+f0354179a"

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-arm64
          # macos-13 已退役；Intel macOS 用 macos-15-intel
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-latest
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig 曾因 mirror 404/503 导致 "Unable to locate executable file: zig"
      # （v0.6.0 / v0.4.0 发布失败根因），改为从 ziglang.org/builds 直接下载。
      # 注意：$GITHUB_PATH 只对后续步骤生效，当前步骤内须用绝对路径验证。
      - name: Setup Zig
        run: |
          case "${{ matrix.platform }}" in
            darwin-arm64) TRIPLET="zig-aarch64-macos" ;;
            darwin-x64)   TRIPLET="zig-x86_64-macos" ;;
            linux-x64)    TRIPLET="zig-x86_64-linux" ;;
          esac
          URL="https://ziglang.org/builds/${TRIPLET}-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$URL" -o zig.tar.xz
          tar -xJf zig.tar.xz
          ZIG_DIR="$GITHUB_WORKSPACE/${TRIPLET}-${ZIG_VERSION}"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3 rocksdb libpq

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev librocksdb-dev libpq-dev
          # 确保 PostgreSQL 头文件存在（此前 apt 曾跳过 libpq-dev 导致构建失败）
          test -f /usr/include/libpq-fe.h && echo "libpq-fe.h OK" || sudo apt-get install -y libpq-dev

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp zig-out/bin/zponder artifacts/zponder
          chmod +x artifacts/zponder

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: artifacts/zponder

  publish:
    name: publish npm
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin-arm64
        uses: actions/download-artifact@v4
        with: { name: binary-darwin-arm64, path: npm/zponder/bin/darwin-arm64 }
        continue-on-error: true

      - name: Download darwin-x64
        uses: actions/download-artifact@v4
        with: { name: binary-darwin-x64, path: npm/zponder/bin/darwin-x64 }
        continue-on-error: true

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with: { name: binary-linux-x64, path: npm/zponder/bin/linux-x64 }
        continue-on-error: true

      - name: Set permissions
        run: chmod +x npm/zponder/bin/*/zponder 2>/dev/null || true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd npm/zponder
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Version: $VERSION"

      - name: Publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: npm/zponder
          access: public
